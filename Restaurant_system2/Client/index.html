<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Performance optimizations -->
    <meta name="theme-color" content="#ffffff">
    
    <!-- DNS prefetch and preconnect for faster resource loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <!-- Preconnect to font origins for faster DNS/TLS setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load luxury hotel fonts: Cormorant Garamond for elegant display/headings, Plus Jakarta Sans & Inter for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preload critical assets -->
    <link rel="modulepreload" href="/src/main.ts">
    
    <title>Executive Hotel – Addis Ababa | Luxury Hotel &amp; Restaurant Experience</title>
    <style>
      /* Initial loader styles - luxury dark navy and gold palette */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #101827;
        color: #ffffff;
        transition: opacity 0.3s ease;
      }
      
      #initial-loader .logo-container {
        position: relative;
        margin-bottom: 2rem;
      }
      
      #initial-loader .spinner-ring {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #initial-loader .ring-static {
        width: 10rem;
        height: 10rem;
        border-radius: 9999px;
        border: 2px solid rgba(214, 169, 79, 0.2);
      }
      
      #initial-loader .ring-animated {
        position: absolute;
        width: 10rem;
        height: 10rem;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: #D6A94F;
        border-right-color: rgba(214, 169, 79, 0.5);
        animation: spin 1.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }
      
      #initial-loader .logo-image {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 10rem;
        height: 10rem;
      }
      
      #initial-loader img {
        width: 6.5rem;
        height: 6.5rem;
        object-fit: contain;
        animation: pulse 2s ease-in-out infinite;
      }
      
      #initial-loader h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 0.5rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.3s;
        opacity: 0;
      }
      
      #initial-loader .subtitle {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #D6A94F;
        margin-bottom: 1.5rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.5s;
        opacity: 0;
      }
      
      #initial-loader .stars {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 2rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.7s;
        opacity: 0;
      }
      
      #initial-loader .star {
        color: #D6A94F;
        font-size: 1.25rem;
      }
      
      #initial-loader .loading-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      #initial-loader .dots {
        display: flex;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      
      #initial-loader .dot {
        width: 0.45rem;
        height: 0.45rem;
        background-color: #D6A94F;
        border-radius: 9999px;
        animation: bounce 1.4s ease-in-out infinite;
      }
      
      #initial-loader .dot:nth-child(1) { animation-delay: 0s; }
      #initial-loader .dot:nth-child(2) { animation-delay: 0.15s; }
      #initial-loader .dot:nth-child(3) { animation-delay: 0.3s; }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.95); }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <!-- Initial Loader - Shown before Vue app loads -->
    <div id="initial-loader">
      <div class="logo-container">
        <div class="spinner-ring">
          <div class="ring-static"></div>
          <div class="ring-animated"></div>
        </div>
        <div class="logo-image">
          <img src="/images/Hotel logo.png" alt="Hotel Logo" />
        </div>
      </div>
      <h1>EXECUTIVE HOTEL</h1>
      <p class="subtitle">Luxury Hotel &amp; Restaurant Experience</p>
      <div class="stars">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
      </div>
      <p class="loading-text">Loading...</p>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
